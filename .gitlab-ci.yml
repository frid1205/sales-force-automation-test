variables:
  PROJECT_NAME: "stp-mobile-automation-test"

stages:
  - deployment

## DEPLOYMENT ##########################################################
deployment:
  stage: deployment
  image: docker:stable
  services:
    - docker:dind

  before_script:
    - docker login -u gitlab-ci-token -p ${CI_JOB_TOKEN} ${CI_REGISTRY}  
    - docker stop ${PROJECT_NAME} 2> /dev/null || true
    - docker rm ${PROJECT_NAME} 2> /dev/null || true

  script:
    - docker compose -f compose.yml up -d
   
  only:
    - mobile-automation-ci
  tags:
    - hostinger-lumos-pro
  when: manual