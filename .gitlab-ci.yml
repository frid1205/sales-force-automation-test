variables:
  PROJECT_NAME: "stp-mobile-automation-test"

stages:
  - deployment
  - run-test

## DEPLOYMENT ##########################################################
deployment:
  stage: deployment
  image: docker:stable
  services:
    - docker:dind

  before_script:
    - docker login -u gitlab-ci-token -p ${CI_JOB_TOKEN} ${CI_REGISTRY}  
    - docker stop ${PROJECT_NAME} 2> /dev/null || true
    - docker rm ${PROJECT_NAME} 2> /dev/null || true

  script:
    - docker compose build --no-cache
    - docker compose up -d
   
  only:
    - mobile-automation-ci
  tags:
    - biznet-lumos-virtual
  when: manual

### RUN TEST ############################################################
run-test:
  stage: run-test
  image: docker:stable
  services:
    - docker:dind
  script:
    - docker exec stp-mobile-automation-test /bin/bash -c "mvn test"
  only:
    - mobile-automation-ci
  tags:
    - biznet-lumos-virtual
  when: manual  
