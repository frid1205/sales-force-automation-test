variables:
  PROJECT_NAME: "stp-mobile-automation-test"

stages:
  - deployment

## DEPLOYMENT ##########################################################
deployment:
  stage: deployment
  image: docker:stable
  services:
    - docker:dind

  script:
    - docker compose -f compose.yml up -d
   
  only:
    - mobile-automation-ci
  tags:
    - hostinger-lumos-pro
  when: manual