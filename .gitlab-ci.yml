variables: 
  PROJECT_NAME: ${CI_PROJECT_NAME}

stages:
  - deployment

test-automation:
  stage: deployment
  image: docker:stable
  services:
    - docker:dind
  before_script:
    - docker login -u gitlab-ci-token -p ${CI_JOB_TOKEN} ${CI_REGISTRY}
    - docker stop ${PROJECT_NAME} 2> /dev/null || true
    - docker rm ${PROJECT_NAME} 2> /dev/null || true
    - docker build -t ${PROJECT_NAME} -f Dockerfile .
  script:
    - docker run -d -p 8811:80 --restart unless-stopped --name=${PROJECT_NAME}  ${PROJECT_NAME}
  only:
    - master
    - ci
  tags:
    - biznet-lumos-dev



    
