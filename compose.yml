version: '3'
services:
  android:
    container_name: stp-mobile-automation-test
    image: stp-mobile-automation-test
    build:
      context: .
      dockerfile: Dockerfile
    privileged: true
    devices:
      - /dev/kvm
    ports:
      - "6080:6080"  # VNC Web UI
      - "4723:4723"  # Appium server
      - "5554:5554"   # Emulator
      - "5555:5555"   # ADB
    environment:
      - DEVICE=Nexus 5
      - AUTO_START=true
      - CONNECT_TO_GRID=false
      - EMULATOR_PARAMS="-no-audio -no-window -gpu swiftshader_indirect"
      - APPIUM_ARGS="--allow-insecure adb_shell"
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - /root/storage/stp-automation-test/stp.apk:/root/stp.apk

