[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:emulator]
command=/usr/local/bin/docker-android start
autostart=true
autorestart=true
startsecs=10
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr

[program:appium]
command=appium --allow-insecure=adb_shell
autostart=true
autorestart=true
startsecs=10
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
