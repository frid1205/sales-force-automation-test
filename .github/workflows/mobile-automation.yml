name: Mobile Automation Test (BrowserStack)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  repository_dispatch:
    types: [ hris-api-push ]
  workflow_dispatch:

jobs:
  mobile-test:
    name: Run Mobile Test on BrowserStack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Run Test on BrowserStack
        env:
          IS_CLOUD: "true"
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: mvn test -DisCloud=true

      - name: Upload Extent Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Test-Report
          path: index.html
          retention-days: 14
